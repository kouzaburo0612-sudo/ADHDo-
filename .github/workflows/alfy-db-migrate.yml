name: Alfy DB Migrate

# Supabase Management API 経由で未適用マイグレーションを実行する
on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Run pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set"
            exit 1
          fi
          cat > query.sql <<'SQL'
          alter table events add column if not exists ng_weekdays int[];
          alter table events add column if not exists memo text;
          alter table participants add column if not exists priority text;
          SQL
          jq -n --rawfile q query.sql '{query:$q}' > body.json
          code=$(curl -sS -o result.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/ofdxvvaflvypythoieih/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d @body.json)
          echo "HTTP $code"; cat result.json
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]

      - name: Verify columns exist
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          jq -n '{query:"select table_name, column_name from information_schema.columns where (table_name = '\''events'\'' and column_name in ('\''ng_weekdays'\'','\''memo'\'')) or (table_name = '\''participants'\'' and column_name = '\''priority'\'') order by table_name, column_name"}' > body.json
          code=$(curl -sS -o result.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/ofdxvvaflvypythoieih/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d @body.json)
          echo "HTTP $code"; cat result.json
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]
          count=$(jq 'length' result.json)
          echo "columns found: $count"
          [ "$count" -eq 3 ]
