name: MH 5. Withings Callback Function

# Withings OAuth連携のサーバ側一式:
# - withings-callback: 認可後リダイレクトをアプリ(vyta://)へ引き渡す
# - withings-token: 認可コード交換 / リフレッシュ(Client SecretはSupabase secretsに保持)
# PAT・Withings資格情報はどちらも暗号化入力で受け取り、ログに出さない。
on:
  workflow_dispatch:
    inputs:
      enc_pat:
        description: '暗号化されたSupabaseアクセストークン(内部用)'
        required: true
      enc_withings:
        description: '暗号化されたWithings client_id:client_secret(内部用・省略時はsecrets設定をスキップ)'
        required: false
        default: ''
      project_ref:
        description: 'SupabaseプロジェクトRef'
        required: false
        default: 'wxqsvcsrbuidqqsmkqnx'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: master-health
    steps:
      - name: Checkout (master-healthブランチを固定でチェックアウト)
        uses: actions/checkout@v4
        with:
          ref: claude/master-health-ios-06hrvw

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Decrypt credentials
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ENC_PAT: ${{ inputs.enc_pat }}
          ENC_WITHINGS: ${{ inputs.enc_withings }}
        run: |
          set -euo pipefail
          strip_ansi() { sed 's/\x1b\[[0-9;]*m//g'; }
          fetch_chunks() {
            local name="$1" out="" i=0 raw val
            while [ $i -lt 30 ]; do
              raw=$(timeout 120 eas env:get --variable-name "${name}_${i}" --variable-environment production --format short --non-interactive </dev/null 2>/dev/null || true)
              val=$(printf '%s' "$raw" | strip_ansi | tr -d '\r' | sed -n "s/^${name}_${i}=//p" | tr -d '\n')
              [ -z "$val" ] && break
              out="${out}${val}"
              i=$((i+1))
            done
            [ -n "$out" ] || return 1
            printf '%s' "$out"
          }
          PRIV_B64=$(fetch_chunks MH_BOOT_PRIV) || { echo "::error::bootstrap秘密鍵がありません"; exit 1; }
          printf '%s' "$PRIV_B64" | base64 -d > /tmp/boot_priv.pem
          decrypt_input() {
            local enc="$1" outfile="$2"
            printf '%s' "${enc%%.*}" | base64 -d > /tmp/wrapped.bin
            printf '%s' "${enc#*.}" | base64 -d > /tmp/secret.enc
            openssl pkeyutl -decrypt -inkey /tmp/boot_priv.pem -in /tmp/wrapped.bin -out /tmp/aes.pass -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
            openssl enc -d -aes-256-cbc -pbkdf2 -pass file:/tmp/aes.pass -in /tmp/secret.enc > "$outfile"
            rm -f /tmp/aes.pass /tmp/secret.enc /tmp/wrapped.bin
            chmod 600 "$outfile"
          }
          decrypt_input "$ENC_PAT" /tmp/sb_pat
          echo "::add-mask::$(cat /tmp/sb_pat)"
          if [ -n "$ENC_WITHINGS" ]; then
            decrypt_input "$ENC_WITHINGS" /tmp/withings_creds
            WID="${ENC_WITHINGS:0:0}$(cut -d: -f1 /tmp/withings_creds)"
            WSEC="$(cut -d: -f2 /tmp/withings_creds)"
            echo "::add-mask::$WID"
            echo "::add-mask::$WSEC"
          fi
          rm -f /tmp/boot_priv.pem
          echo "資格情報を復号しました"

      - name: Set Withings secrets on Supabase
        if: ${{ inputs.enc_withings != '' }}
        env:
          PROJECT_REF: ${{ inputs.project_ref }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --break-system-packages requests 2>/dev/null || python3 -m pip install --quiet requests
          python3 - << 'PYEOF'
          import os, requests
          ref = os.environ['PROJECT_REF']
          pat = open('/tmp/sb_pat').read().strip()
          wid, wsec = open('/tmp/withings_creds').read().strip().split(':', 1)
          r = requests.post(
              f'https://api.supabase.com/v1/projects/{ref}/secrets',
              headers={'Authorization': f'Bearer {pat}'},
              json=[{'name': 'WITHINGS_CLIENT_ID', 'value': wid},
                    {'name': 'WITHINGS_CLIENT_SECRET', 'value': wsec}],
              timeout=60,
          )
          print('secrets ->', r.status_code)
          if r.status_code not in (200, 201):
              print(r.text[:300])
              raise SystemExit(1)
          print('SECRETS: OK')
          PYEOF

      - name: Deploy edge functions
        env:
          PROJECT_REF: ${{ inputs.project_ref }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --break-system-packages requests 2>/dev/null || python3 -m pip install --quiet requests
          python3 - << 'PYEOF'
          import os, requests

          ref = os.environ['PROJECT_REF']
          pat = open('/tmp/sb_pat').read().strip()
          H = {'Authorization': f'Bearer {pat}'}
          B = 'https://api.supabase.com'

          callback_code = '''
          // Withings OAuth callback: 認可コードをアプリ(vyta://)へ引き渡す
          Deno.serve((req: Request) => {
            const url = new URL(req.url);
            const code = url.searchParams.get("code") ?? "";
            const state = url.searchParams.get("state") ?? "";
            const err = url.searchParams.get("error") ?? "";
            const target = "vyta://withings-callback?code=" + encodeURIComponent(code)
              + "&state=" + encodeURIComponent(state) + "&error=" + encodeURIComponent(err);
            const html = `<!doctype html><html><head><meta charset="utf-8">
          <meta http-equiv="refresh" content="0;url=${target}">
          <title>VYTA</title></head>
          <body style="background:#0B1220;color:#E6EDF3;font-family:-apple-system;text-align:center;padding-top:40vh">
          <p>VYTAに戻っています…</p>
          <p><a style="color:#40D9C4" href="${target}">自動で戻らない場合はタップ</a></p>
          </body></html>`;
            return new Response(html, { status: 200, headers: { "Content-Type": "text/html; charset=utf-8" } });
          });
          '''

          token_code = '''
          // Withings token交換/リフレッシュ。Client Secretはここ(サーバ側)にのみ存在する
          Deno.serve(async (req: Request) => {
            if (req.method !== "POST") return new Response("POST only", { status: 405 });
            let body: { action?: string; code?: string; refresh_token?: string };
            try { body = await req.json(); } catch { return new Response("bad json", { status: 400 }); }
            const id = Deno.env.get("WITHINGS_CLIENT_ID") ?? "";
            const secret = Deno.env.get("WITHINGS_CLIENT_SECRET") ?? "";
            if (!id || !secret) return new Response(JSON.stringify({ error: "server not configured" }), { status: 500 });
            const p = new URLSearchParams({ action: "requesttoken", client_id: id, client_secret: secret });
            if (body.action === "exchange") {
              p.set("grant_type", "authorization_code");
              p.set("code", body.code ?? "");
              p.set("redirect_uri", "https://wxqsvcsrbuidqqsmkqnx.supabase.co/functions/v1/withings-callback");
            } else if (body.action === "refresh") {
              p.set("grant_type", "refresh_token");
              p.set("refresh_token", body.refresh_token ?? "");
            } else {
              return new Response(JSON.stringify({ error: "bad action" }), { status: 400 });
            }
            const r = await fetch("https://wbsapi.withings.net/v2/oauth2", {
              method: "POST",
              headers: { "Content-Type": "application/x-www-form-urlencoded" },
              body: p.toString(),
            });
            const j = await r.text();
            return new Response(j, { status: 200, headers: { "Content-Type": "application/json" } });
          });
          '''

          def deploy(slug, code):
              meta = '{"entrypoint_path":"index.ts","name":"%s","verify_jwt":false}' % slug
              r = requests.post(
                  f'{B}/v1/projects/{ref}/functions/deploy?slug={slug}',
                  headers=H,
                  files={
                      'metadata': (None, meta, 'application/json'),
                      'file': ('index.ts', code, 'application/typescript'),
                  },
                  timeout=120,
              )
              print(f'deploy {slug} ->', r.status_code)
              if r.status_code not in (200, 201):
                  print(r.text[:400])
                  raise SystemExit(1)

          deploy('withings-callback', callback_code)
          deploy('withings-token', token_code)

          r2 = requests.get(f'https://{ref}.supabase.co/functions/v1/withings-callback?code=test&state=test', timeout=60)
          print('callback check ->', r2.status_code)
          r3 = requests.post(f'https://{ref}.supabase.co/functions/v1/withings-token',
                             json={'action': 'refresh', 'refresh_token': 'dummy'}, timeout=60)
          print('token fn check ->', r3.status_code, r3.text[:200])
          print('DEPLOY: OK' if r2.status_code == 200 and r3.status_code == 200 else 'DEPLOY: WARN(要確認)')
          PYEOF
